name: Build iOS Test IPA ZIP
on:
  workflow_dispatch:
  push:
    branches: [main, ant-bms-ios-test]
    paths:
      - 'app/**'
      - 'rust/**'
      - 'scripts/**'
      - '.github/workflows/ios-test-ipa.yml'
permissions:
  contents: read
concurrency:
  group: ios-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ipa:
    permissions:
      contents: write
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      IPHONEOS_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Verify protocol
        run: cargo +stable test --manifest-path rust/Cargo.toml --locked
      - name: Generate platform shells and resolve dependencies
        run: bash scripts/bootstrap.sh
      - name: Build and link Rust iOS libraries
        run: bash scripts/build_ios_rust.sh
      - name: Check Dart and Flutter source
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Verify dashboard layouts
        working-directory: app
        run: flutter test
      - name: Check presentation rules
        working-directory: tools
        run: |
          dart pub get
          dart run profile_smoke.dart
          dart run archive_smoke.dart
          dart run ble_channel_smoke.dart
          dart run gps_speed_smoke.dart
          dart run device_protocol_smoke.dart
          dart run bms_details_smoke.dart
          dart run device_history_smoke.dart
          dart run ui_features_smoke.dart
      - name: Compile and package unsigned IPA
        run: bash scripts/package_ios_unsigned.sh
      - name: Stage iOS artifact files
        run: python3 scripts/package_test_zip.py ios
      - name: Upload IPA and notes
        uses: actions/upload-artifact@v4
        with:
          name: ANT-BMS-iOS-unsigned-${{ github.run_number }}
          path: dist/ios-artifact/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct IPA download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ios-test-${{ github.run_number }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$BUILD_SHA" --prerelease --title "ANT BMS iOS unsigned test $RELEASE_TAG" --notes-file dist/ios-artifact/README.txt
          fi
          gh release upload "$RELEASE_TAG" dist/ios-artifact/ANT-BMS-unsigned.ipa dist/ios-artifact/SHA256SUMS.txt --clobber
          echo "IPA: https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/ANT-BMS-unsigned.ipa" >> "$GITHUB_STEP_SUMMARY"
