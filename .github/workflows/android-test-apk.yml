name: Build Android Test APK ZIP
on:
  workflow_dispatch:
  push:
    branches: [main, ant-bms-ios-test]
    paths: ['app/**', 'rust/**', 'scripts/**', '.github/workflows/android-test-apk.yml']
permissions:
  contents: read
concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Install Rust and Android NDK
        run: |
          rustup toolchain install stable --profile minimal
          cargo install cargo-ndk --locked
          sdkmanager 'ndk;27.0.12077973'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Verify protocol
        run: cargo +stable test --manifest-path rust/Cargo.toml --locked
      - name: Generate platform shells
        env:
          ANT_PLATFORMS: android
        run: bash scripts/bootstrap.sh
      - name: Build Rust Android libraries
        run: bash scripts/build_android_rust.sh
      - name: Analyze and test Flutter
        working-directory: app
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Compile test APK
        working-directory: app
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64
      - name: Verify native libraries and package ZIP
        run: |
          python3 -c "import zipfile; z=zipfile.ZipFile('app/build/app/outputs/flutter-apk/app-release.apk'); assert all('lib/'+abi+'/libant_core.so' in z.namelist() for abi in ['arm64-v8a','armeabi-v7a','x86_64'])"
          python3 scripts/package_test_zip.py android
      - name: Upload APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ANT-BMS-Android-test-${{ github.run_number }}
          path: dist/ANT-BMS-android-test.zip
          if-no-files-found: error
          retention-days: 14
