name: Build Android Test APK ZIP
on:
  workflow_dispatch:
  push:
    branches: [main, ant-bms-ios-test]
    paths: ['app/**', 'rust/**', 'scripts/**', '.github/workflows/android-test-apk.yml']
permissions:
  contents: read
concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Rust and Android NDK
        run: |
          rustup toolchain install stable --profile minimal
          cargo install cargo-ndk --locked
          sdkmanager 'ndk;27.0.12077973'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Verify protocol
        run: cargo +stable test --manifest-path rust/Cargo.toml --locked
      - name: Generate platform shells
        env:
          ANT_PLATFORMS: android
        run: bash scripts/bootstrap.sh
      - name: Build Rust Android libraries
        run: bash scripts/build_android_rust.sh
      - name: Analyze and test Flutter
        working-directory: app
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Compile test APK
        working-directory: app
        run: flutter build apk --release --target-platform android-arm,android-arm64,android-x64
      - name: Verify native libraries and stage artifact files
        run: |
          python3 -c "import zipfile; z=zipfile.ZipFile('app/build/app/outputs/flutter-apk/app-release.apk'); assert all('lib/'+abi+'/libant_core.so' in z.namelist() for abi in ['arm64-v8a','armeabi-v7a','x86_64'])"
          python3 scripts/package_test_zip.py android
      - name: Upload APK and notes
        uses: actions/upload-artifact@v4
        with:
          name: ANT-BMS-Android-test-${{ github.run_number }}
          path: dist/android-artifact/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: android-test-${{ github.run_number }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$BUILD_SHA" --prerelease --title "ANT BMS Android test $RELEASE_TAG" --notes-file dist/android-artifact/README.txt
          fi
          gh release upload "$RELEASE_TAG" dist/android-artifact/ANT-BMS-test.apk dist/android-artifact/SHA256SUMS.txt --clobber
          echo "APK: https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/ANT-BMS-test.apk" >> "$GITHUB_STEP_SUMMARY"
