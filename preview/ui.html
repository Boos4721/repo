<div id="ant-ui" class="viz-dotted-background">
<style>
#ant-ui{padding:20px 8px;display:flex;justify-content:center;color-scheme:light dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#ant-ui *{box-sizing:border-box}#ant-ui .phone{--bg:light-dark(#f4f7f7,#101819);--surface:light-dark(#ffffff,#1b2627);--ink:light-dark(#172c2d,#e9f3f2);--sub:light-dark(#617475,#9db4b4);--line:light-dark(#e4ebeb,#2b3b3d);--brand:light-dark(#087e78,#72ddd1);--soft:light-dark(#e6f4f0,#203f3c);--warn:light-dark(#99640a,#ffd086);--warnbg:light-dark(#fff4de,#3f3320);background:var(--bg);color:var(--ink);width:100%;max-width:410px;border:1px solid var(--line);border-radius:30px;overflow:hidden;position:relative;box-shadow:0 16px 48px #00000014;font-size:14px;line-height:1.5}
#ant-ui button,#ant-ui input{font:inherit}#ant-ui button{color:inherit;border:0;background:none;min-height:44px}#ant-ui button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}#ant-ui .status{display:flex;justify-content:space-between;padding:13px 23px 4px;font-size:12px;font-weight:600}#ant-ui .top{padding:17px 22px 12px;display:flex;justify-content:space-between;align-items:center}#ant-ui .brand{font-weight:700;font-size:22px;letter-spacing:-.6px}#ant-ui .eyebrow{font-size:11px;color:var(--sub);letter-spacing:1.3px}#ant-ui .connect{display:flex;gap:6px;align-items:center;background:var(--soft);color:var(--brand);border-radius:22px;padding:0 12px;font-size:12px}#ant-ui .dot{height:6px;width:6px;border-radius:50%;background:currentColor}#ant-ui main{padding:4px 18px 20px;min-height:570px}#ant-ui .device{padding:0 4px 15px;color:var(--sub);font-size:12px;display:flex;justify-content:space-between}#ant-ui .hero{padding:21px;border-radius:24px;background:var(--surface);position:relative}#ant-ui .split{display:flex;align-items:center;justify-content:space-between;gap:12px}#ant-ui .muted{color:var(--sub);font-size:12px}#ant-ui .badge{color:var(--brand);background:var(--soft);border-radius:7px;padding:4px 8px;font-size:11px}#ant-ui .soc{font-size:64px;line-height:1.15;font-weight:650;letter-spacing:-3px;margin:15px 0 4px}#ant-ui .soc span{font-size:22px;letter-spacing:0;color:var(--sub);font-weight:400}#ant-ui .battery{width:74px;height:116px;border:2px solid var(--line);border-radius:16px;padding:5px;position:relative}#ant-ui .battery:before{content:"";position:absolute;top:-7px;left:22px;width:26px;height:5px;background:var(--line);border-radius:3px}#ant-ui .battery div{height:72%;position:absolute;bottom:5px;left:5px;right:5px;border-radius:10px;background:var(--brand);opacity:.85}#ant-ui .herofoot{border-top:1px solid var(--line);margin-top:19px;padding-top:13px;display:flex;justify-content:space-between;font-size:12px}#ant-ui .metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}#ant-ui .metric{background:var(--surface);padding:14px 16px;border-radius:18px}#ant-ui .value{font-size:24px;font-weight:600;letter-spacing:-.6px;font-variant-numeric:tabular-nums;margin-top:3px}#ant-ui .value small{font-size:12px;color:var(--sub);font-weight:400;letter-spacing:0}#ant-ui .section{margin-top:21px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;font-weight:600}#ant-ui .section button{font-weight:400;color:var(--brand);font-size:12px;min-height:30px}#ant-ui .panel{background:var(--surface);border-radius:18px;padding:15px}#ant-ui .mos{display:flex;justify-content:space-between;padding-top:12px;border-top:1px solid var(--line);margin-top:12px;font-size:12px}#ant-ui .mos b{color:var(--brand);font-weight:500}#ant-ui nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:8px 6px 17px}#ant-ui nav button{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--sub);padding:7px 0}#ant-ui nav button[aria-selected=true]{color:var(--brand)}#ant-ui svg.lucide{width:20px;height:20px}#ant-ui .title{font-size:25px;font-weight:650;letter-spacing:-.7px;margin:5px 4px 2px}#ant-ui .subtitle{margin:0 4px 18px;font-size:12px;color:var(--sub)}#ant-ui .stats{display:flex;justify-content:space-between;gap:8px}#ant-ui .stats strong{display:block;font-size:22px;margin-top:3px;font-variant-numeric:tabular-nums}#ant-ui .cells{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}#ant-ui .cell{border-radius:13px;background:var(--surface);padding:10px 11px;text-align:left;font-size:12px}#ant-ui .cell small{display:block;color:var(--sub);font-size:11px}#ant-ui .cell strong{display:block;font-size:16px;margin:4px 0;font-weight:600;font-variant-numeric:tabular-nums}#ant-ui .cell.low{background:var(--warnbg)}#ant-ui .cell.high{background:var(--soft)}#ant-ui .cell.selected{outline:2px solid var(--brand)}#ant-ui .cellbar{height:3px;background:var(--line);border-radius:3px}#ant-ui .cellbar span{display:block;height:3px;background:var(--brand);border-radius:3px}#ant-ui .detail{margin-top:12px;font-size:12px;color:var(--sub)}#ant-ui .seg{display:flex;gap:4px;padding:4px;background:var(--line);border-radius:13px;margin:14px 0}#ant-ui .seg button{flex:1;border-radius:10px;font-size:12px;min-height:35px}#ant-ui .seg button.active{background:var(--surface);color:var(--brand)}#ant-ui .chart{width:100%;height:auto;display:block;color:var(--sub);font-size:11px;margin-top:15px}#ant-ui .row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;gap:12px;border-bottom:1px solid var(--line)}#ant-ui .row:last-child{border-bottom:0}#ant-ui .row button{color:var(--brand);padding:0 6px;font-size:12px}#ant-ui .row strong{font-weight:550;font-size:13px}#ant-ui .row small{display:block;color:var(--sub);font-size:11px;margin-top:3px}#ant-ui .action{display:block;width:100%;background:var(--brand);color:var(--bg);border-radius:13px;padding:12px;margin-top:15px;font-weight:600}#ant-ui .ghost{border:1px solid var(--line);border-radius:12px;width:100%;margin-top:10px}#ant-ui .note{font-size:11px;color:var(--sub);text-align:center;margin-top:14px}#ant-ui .overlay{position:absolute;inset:0;z-index:3;display:flex;align-items:flex-end;background:#00000060}#ant-ui .overlay[hidden]{display:none}#ant-ui .sheet{background:var(--surface);width:100%;border-radius:26px 26px 0 0;padding:22px 22px 30px}#ant-ui .sheet h3{font-size:20px;margin:0 0 6px}#ant-ui .sheet input{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;margin-top:8px}#ant-ui .toast{margin-top:12px;color:var(--brand);font-size:12px}#ant-ui .toast:empty{display:none}#ant-ui [hidden]{display:none!important}
</style>
<div class="phone">
 <div class="status"><span>20:12</span><span>演示模式 · 100%</span></div>
 <header class="top"><div><div class="eyebrow">BATTERY COMPANION</div><div class="brand">ANT BMS</div></div><button class="connect cursor-interaction" data-action="connect"><span class="dot"></span><span id="conn-label">模拟已连接</span><i data-lucide="bluetooth" aria-hidden="true"></i></button></header>
 <main id="ant-content" aria-live="polite"></main>
 <nav aria-label="主导航">
  <button class="cursor-interaction" data-page="overview" aria-selected="true"><i data-lucide="layout-dashboard" aria-hidden="true"></i>总览</button>
  <button class="cursor-interaction" data-page="cells" aria-selected="false"><i data-lucide="layers" aria-hidden="true"></i>单体</button>
  <button class="cursor-interaction" data-page="history" aria-selected="false"><i data-lucide="chart-no-axes-combined" aria-hidden="true"></i>记录</button>
  <button class="cursor-interaction" data-page="device" aria-selected="false"><i data-lucide="sliders-horizontal" aria-hidden="true"></i>设备</button>
 </nav>
 <div class="overlay" id="ant-sheet" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="ant-sheet-title"><div class="split"><h3 id="ant-sheet-title"></h3><button class="cursor-interaction" data-action="close" aria-label="关闭"><i data-lucide="x" aria-hidden="true"></i></button></div><div id="ant-sheet-body"></div></section></div>
</div>
<script>
(()=>{const root=document.getElementById('ant-ui'),content=root.querySelector('#ant-content'),overlay=root.querySelector('#ant-sheet');let page='overview',connected=true,recording=false,metric='current',period='today',previousFocus=null;const volts=[3.902,3.901,3.9,3.899,3.905,3.904,3.897,3.901,3.9,3.901,3.902,3.903,3.9,3.899,3.901,3.902,3.9,3.901,3.898,3.902,3.903];const total=volts.reduce((a,b)=>a+b,0).toFixed(2);const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;const rows=items=>items.map(([a,b,c])=>`<div class="row"><div><strong>${a}</strong><small>${b}</small></div>${c}</div>`).join('');
function chart(){const current=metric==='current',today=period==='today',vals=current?[11,16,12,25,19,31,22,35,24,21,17,18.6]:[82.7,82.5,82.6,82.2,82.3,81.9,82.1,81.7,81.8,81.9,82,81.94],lo=current?0:81,hi=current?40:83;const path=vals.map((v,i)=>`${i?'L':'M'}${42+i*23.4},${138-(v-lo)/(hi-lo)*108}`).join(' ');return `<svg class="chart" viewBox="0 0 320 174" role="img" aria-label="模拟${today?'今日':'昨日'}${current?'电流':'总压'}曲线"><text x="4" y="15">${current?'电流 / A':'总压 / V'}</text>${[hi,(hi+lo)/2,lo].map((v,i)=>`<line x1="40" x2="300" y1="${30+i*54}" y2="${30+i*54}" stroke="var(--line)"/><text x="3" y="${34+i*54}" fill="currentColor">${v}</text>`).join('')}<path d="${path}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/><text x="42" y="159" fill="currentColor">${today?'19:30':'18:20'}</text><text x="160" y="159" fill="currentColor" text-anchor="middle">${today?'19:50':'18:40'}</text><text x="300" y="159" fill="currentColor" text-anchor="end">${today?'20:10':'19:00'}</text></svg>`}
function render(){root.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-selected',b.dataset.page===page));if(page==='overview'){content.innerHTML=`<div class="device"><span>我的电池 · 21S / 170Ah</span><span>${connected?'刚刚更新':'已断开 · 数据已过期'}</span></div><section class="hero"><div class="split"><span class="muted">剩余电量</span><span class="badge">${connected?'正在放电':'最后一次数据'}</span></div><div class="split"><div><div class="soc">72<span> %</span></div><div class="muted">剩余 122.4 / 170 Ah</div></div><div class="battery" aria-label="电量72%"><div></div></div></div><div class="herofoot"><span>三元锂 · 21 串</span><span>约 10.03 kWh 剩余能量</span></div></section><div class="metrics"><div class="metric"><div class="muted">总电压</div><div class="value">${total} <small>V</small></div></div><div class="metric"><div class="muted">放电电流</div><div class="value">18.6 <small>A</small></div></div><div class="metric"><div class="muted">放电功率</div><div class="value">1.52 <small>kW</small></div></div><div class="metric"><div class="muted">最高温度</div><div class="value">32.4 <small>°C</small></div></div></div><div class="section">电池状态<button data-action="cells" class="cursor-interaction">查看单体 →</button></div><div class="panel"><div class="split"><span>单体压差</span><strong>8 mV</strong></div><div class="mos"><span>充电 MOS <b>开启</b></span><span>放电 MOS <b>开启</b></span><span>告警 <b>无</b></span></div></div><div class="note">模拟数据 · 暂未连接真实保护板</div>`}
else if(page==='cells'){content.innerHTML=`<div class="title">每一串，都看得见</div><div class="subtitle">21 串单体电压 · 点击查看详情</div><div class="panel stats"><div><span class="muted">最大压差</span><strong>8 <small>mV</small></strong></div><div><span class="muted">最高 · #05</span><strong>3.905 <small>V</small></strong></div><div><span class="muted">最低 · #07</span><strong>3.897 <small>V</small></strong></div></div><div class="cells">${volts.map((v,i)=>`<button class="cell cursor-interaction ${i===4?'high':i===6?'low':''}" data-cell="${i}" aria-label="第${i+1}串 ${v.toFixed(3)}伏"><small>#${String(i+1).padStart(2,'0')}${i===4?' · 最高':i===6?' · 最低':''}</small><strong>${v.toFixed(3)} <small style="display:inline">V</small></strong><div class="cellbar"><span style="width:${(v/4.2*100).toFixed(1)}%"></span></div></button>`).join('')}</div><div class="detail" id="ant-cell-detail">当前均衡：关闭 · 电压仅为模拟数据</div>`}
else if(page==='history'){content.innerHTML=`<div class="title">充放电记录</div><div class="subtitle">留住每一次电池变化</div><div class="seg"><button data-period="today" class="cursor-interaction ${period==='today'?'active':''}">今天</button><button data-period="yesterday" class="cursor-interaction ${period==='yesterday'?'active':''}">昨天</button></div><div class="panel"><div class="split"><strong>${period==='today'?'晚间骑行':'下班骑行'}</strong><span class="badge">放电记录</span></div><div class="muted" style="margin-top:5px">${period==='today'?'19:30–20:10':'18:20–19:00'} · 40 分钟</div><div class="seg"><button data-metric="current" class="cursor-interaction ${metric==='current'?'active':''}">电流</button><button data-metric="voltage" class="cursor-interaction ${metric==='voltage'?'active':''}">总压</button></div>${chart()}<div class="mos"><span>消耗 <b>${period==='today'?'0.86':'0.74'} kWh</b></span><span>最高温度 <b>34.2 °C</b></span></div></div><div class="section">采集记录<span class="muted">仅存于本机</span></div><div class="panel split"><div><strong>${recording?'正在记录模拟数据':'开始一段新记录'}</strong><div class="muted">${recording?'原型演示 · 未采集真实数据':'连接设备后采集电池数据'}</div></div><button class="connect cursor-interaction" data-action="record">${recording?'停止':'开始'}</button></div><button class="ghost cursor-interaction" data-action="export">导出本页模拟数据 CSV</button><div class="toast" id="ant-feedback" role="status"></div>`}
else{content.innerHTML=`<div class="title">我的设备</div><div class="subtitle">电池档案与连接管理</div><div class="panel"><div class="split"><strong>我的电池</strong><span class="badge">演示设备</span></div><div class="muted" style="margin-top:8px">ANT-DEMO · 21S / 170Ah</div><div class="mos"><span>连接 <b>${connected?'模拟已连接':'未连接'}</b></span><span>权限 <b>只读</b></span></div></div><div class="section">电池管理</div><div class="panel">${rows([['电池参数','查看容量、串数与保护阈值','<button data-action="params" class="cursor-interaction">查看 →</button>'],['参数备份','备份配置与恢复入口','<button data-action="backup" class="cursor-interaction">查看 →</button>'],['保护与告警','查看保护状态及故障记录','<button data-action="alerts" class="cursor-interaction">查看 →</button>']])}</div><div class="section">应用设置</div><div class="panel">${rows([['数据刷新','前台每 500ms 请求一次','<span class="muted">500 ms</span>'],['后台记录','遵循 Android / iOS 系统限制','<span class="muted">系统管理</span>'],['关于应用','独立第三方客户端 · UI 原型','<span class="muted">v0.1</span>']])}</div><button class="ghost cursor-interaction" data-action="disconnect">${connected?'断开模拟连接':'连接模拟设备'}</button><div class="note">当前操作只影响原型，不向 BMS 发送指令</div>`}if(globalThis.lucide)lucide.createIcons();}
function sheet(title,html){previousFocus=document.activeElement;root.querySelector('#ant-sheet-title').textContent=title;root.querySelector('#ant-sheet-body').innerHTML=html;overlay.hidden=false;if(globalThis.lucide)lucide.createIcons();overlay.querySelector('[data-action="close"]').focus()}
function close(){overlay.hidden=true;if(previousFocus&&previousFocus.isConnected)previousFocus.focus()}
root.addEventListener('keydown',e=>{if(!overlay.hidden&&e.key==='Escape')close();if(!overlay.hidden&&e.key==='Tab'){const els=Array.from(overlay.querySelectorAll('button,input')).filter(el=>!el.disabled);const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();return}if(b.dataset.cell!==undefined){root.querySelectorAll('.cell').forEach(el=>el.classList.remove('selected'));b.classList.add('selected');const i=+b.dataset.cell;root.querySelector('#ant-cell-detail').textContent=`第 ${i+1} 串 · ${volts[i].toFixed(3)} V · 均衡关闭 · 比最低单体高 ${Math.round((volts[i]-3.897)*1000)} mV`;return}if(b.dataset.metric){metric=b.dataset.metric;render();return}if(b.dataset.period){period=b.dataset.period;render();return}const a=b.dataset.action;if(a==='close')close();if(a==='cells'){page='cells';render()}if(a==='connect')sheet('连接电池',`<p class="muted">选择设备 · 当前为交互演示</p><div class="row"><div><strong>ANT-DEMO</strong><small>21 串 · 170Ah · 模拟设备</small></div><button data-action="pair" class="cursor-interaction">连接</button></div><div class="note">正式版在这里扫描附近的 BLE 设备</div>`);if(a==='pair'){connected=true;root.querySelector('#conn-label').textContent='模拟已连接';close();render()}if(a==='disconnect'){connected=!connected;root.querySelector('#conn-label').textContent=connected?'模拟已连接':'未连接';render()}if(a==='record'){recording=!recording;render()}if(a==='params')sheet('电池参数',`${rows([['电池类型','当前档案','<span>三元锂</span>'],['串数','只读','<span>21 串</span>'],['额定容量','只读','<span>170 Ah</span>']])}<button class="action cursor-interaction" data-action="unlock">解锁参数编辑</button><div class="note">先验证权限，再展示参数差异与保存确认</div>`);if(a==='unlock')sheet('验证操作权限',`<label for="ant-password" class="muted">设备密码</label><input type="password" id="ant-password" placeholder="输入保护板密码" autocomplete="off"><button class="action cursor-interaction" data-action="verify">验证</button><div class="toast" id="ant-verify-feedback" role="status"></div><div class="note">原型不保存或发送密码</div>`);if(a==='verify'){const input=root.querySelector('#ant-password');root.querySelector('#ant-verify-feedback').textContent=input.value?'演示完成：正式版验证设备响应后才开放编辑。':'请先输入设备密码';input.value=''}if(a==='backup')sheet('参数备份',`<p class="muted">尚无备份。正式版连接设备并读取完整参数后，可保存一份带设备身份和时间的备份。</p><button class="ghost cursor-interaction" data-action="close">返回</button>`);if(a==='alerts')sheet('保护与告警',`${rows([['当前保护','模拟状态','<span class="badge">无触发</span>'],['单体过压 / 欠压','模拟状态','<span>未触发</span>'],['充放电过流','模拟状态','<span>未触发</span>'],['温度保护','模拟状态','<span>未触发</span>']])}`);if(a==='export'){const blob=new Blob(['\uFEFFcell,voltage_V\n'+volts.map((v,i)=>`${i+1},${v.toFixed(3)}`).join('\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='ant-bms-demo-cells.csv';link.click();URL.revokeObjectURL(url);root.querySelector('#ant-feedback').textContent='已导出模拟单体数据；不含真实设备信息。'}});render();})();
</script>
</div>
